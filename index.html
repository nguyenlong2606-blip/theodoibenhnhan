<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theo dõi bệnh nhân nội trú</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2733;--mu:#667685;--bd:#dde3e9;--pri:#0b7a75;--in:#1565c0;--out:#c2571a;--bad:#c62828;--ok:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171c;--card:#1a232b;--tx:#e6edf3;--mu:#8fa0ae;--bd:#2c3945;--pri:#3cc4bc;--in:#64b5f6;--out:#ffa264;--bad:#ef7a7a;--ok:#7cd281;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171c;--card:#1a232b;--tx:#e6edf3;--mu:#8fa0ae;--bd:#2c3945;--pri:#3cc4bc;--in:#64b5f6;--out:#ffa264;--bad:#ef7a7a;--ok:#7cd281;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 14px 0}h1{font-size:18px;margin:0 0 10px}
nav{display:flex;gap:6px;padding:0 14px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1 1 0;min-width:0;padding:10px 4px;line-height:1.25;overflow-wrap:break-word;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px;font-weight:600}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:0 14px 40px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);min-width:0}
select{width:100%}
label{font-size:13px;color:var(--mu);display:block;margin:8px 0 4px}
.step{display:flex;gap:8px;align-items:center;margin:8px 0}
.step button{width:56px;height:56px;font-size:28px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.step input{flex:1;height:56px;text-align:center;font-size:28px;font-weight:700}
.go{width:100%;padding:15px;font-size:17px;font-weight:700;border:0;border-radius:12px;color:#fff;margin-top:6px}
.go.in{background:var(--in)}.go.out{background:var(--out)}.go.pri{background:var(--pri)}.go.in,.go.out,.go.pri{color:#fff}
.sm.ask,.log button.ask{background:var(--bad);color:#fff;border-color:var(--bad)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:12px 14px;border-radius:10px;z-index:20;display:none;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.bar.full i{background:var(--bad)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:right}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-size:12px;color:var(--mu);font-weight:600}
tfoot td{font-weight:800;border-top:2px solid var(--tx)}
.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok)}.in{color:var(--in)}.out{color:var(--out)}
.log{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.log button,.sm{border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:8px;padding:6px 10px;font-size:13px}
.mu{color:var(--mu);font-size:13px}.msg{padding:30px 10px;text-align:center;color:var(--mu)}
.grid2{display:grid;grid-template-columns:1fr 90px 90px auto;gap:6px;align-items:center;margin-bottom:6px}
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1>🏥 Theo dõi bệnh nhân nội trú</h1><div class="row" style="gap:6px;justify-content:flex-end"><span id="who"></span><button class="sm" onclick="refreshNow()">↻ Làm mới</button></div></header>
<nav id="nav"></nav>
<div id="toast"></div>
<main id="app"><div class="msg">Đang tải dữ liệu…</div></main>
<script>
const CFG={p:"benhviendakhoatanuyen",k:"AIzaSyDvPKeRtt-t9_FiTOs__wwi2axK8S0EooQ"}; // co the dien san projectId (p) va apiKey (k) tai day
const TABS=[["sum","Tổng hợp"],["pk","Bệnh nhân vào viện"],["khoa","Bệnh nhân ra viện"],["ct","Bệnh nhân chuyển tỉnh"],["xf","Chuyển khoa"],["day","Số lượng bệnh nhân ra, vào, chuyển khoa theo ngày"],["set","Cài đặt"]];
let tab="sum",wards=[],events=[],db=null,ready=false,selK="",selP="",qty={pk:1,khoa:1,xf:1,ct:1},xFrom="",xTo="";
const $=id=>document.getElementById(id);
let pend="",tt,pinHash="",unlocked=false,selDay="",archDay="",archSel="",actual={},when={pk:"",khoa:"",xf:"",ct:""},editId="",editN="",editA="",me=loadMe(),pkHash="";
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(s,n)=>{const[y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n))};
const vnDate=s=>s.split("-").reverse().join("/");
const isTruc=ts=>{const d=new Date(ts),m=d.getHours()*60+d.getMinutes();return m<450||m>=1020};
function censusAt(w,d){let c=w.base||0;events.forEach(e=>{if(e.day>d)return;if(e.type==="xfer"){if(e.ward===w.id)c-=e.n;if(e.to===w.id)c+=e.n}else if(e.ward===w.id)c+=e.type==="in"?e.n:-e.n});return Math.max(0,c)}
function renderXf(a,rows){
  if(wards.length<2){a.innerHTML=`<div class="card msg">Cần có ít nhất 2 khoa để chuyển khoa.</div>`;return}
  xFrom=me.id;
  if(xTo===xFrom||!wards.find(w=>w.id===xTo))xTo=wards.find(w=>w.id!==xFrom).id;
  const f=rows.find(r=>r.id===xFrom),g=rows.find(r=>r.id===xTo);
  const nm=id=>(wards.find(w=>w.id===id)||{name:"?"}).name;
  const l=events.filter(e=>e.type==="xfer"&&e.day===today()).sort((x,y)=>y.ts-x.ts).slice(0,15);
  a.innerHTML=`<div class="card"><b>Chuyển bệnh nhân giữa các khoa</b><p class="mu">Chuyển khoa không tính là ra viện hay nhập viện mới.</p>
  <label>Chuyển từ khoa</label><p style="font-size:17px;margin:8px 0"><b>${esc(f.name)}</b></p>
  <label>Chuyển đến khoa</label><select onchange="xTo=this.value;render()">${opts(xTo,xFrom)}</select>
  <div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${f.cur}</b><span>Đang ĐT: ${esc(f.name)}</span></div><div class="stat"><b>${g.cur}</b><span>Đang ĐT: ${esc(g.name)}</span></div></div>
  <label>Số bệnh nhân chuyển</label>${stepper("xf")}${whenPicker("xf")}<button class="go pri" onclick="addXf()">⇄ Chuyển khoa</button></div>
  ${logList("xfer",xFrom)}`}
async function addXf(){
  const n=num($("q_xf").value);if(!n||!xFrom||!xTo||xFrom===xTo)return;const at=getWhen("xf");if(!at)return;
  const r=calc().find(x=>x.id===xFrom);
  if(r&&n>r.cur&&!ask("xf"+xFrom)){toast(`Số chuyển (${n}) lớn hơn số đang điều trị của khoa (${r.cur}). Bấm lần nữa để vẫn ghi nhận.`);return}
  try{await db.doc("events/e"+Date.now()+Math.floor(Math.random()*1000)).set({ward:xFrom,to:xTo,type:"xfer",n,ts:Date.now(),at,day:repDay(at)});qty.xf=1;when.xf="";render()}catch(e){alert("Lỗi lưu: "+(e.message||e.code))}
}
async function setActualAll(){
  const rows=calc();let n=0;
  try{for(const r of rows){const el=$("t_"+r.id);if(!el||el.value==="")continue;const v=parseInt(el.value);
      if(isNaN(v)||v<0){toast("Số không hợp lệ ở "+r.name);return}
      await db.doc("wards/"+r.id).update({base:v-(r.inA-r.outA+r.xIn-r.xOut)});n++}
    actual={};toast(n?"Đã đặt lại số đang điều trị cho "+n+" khoa":"Chưa nhập số nào");render()}catch(e){toast("Lỗi: "+e.message)}}
function refreshNow(){if(!db||!db.refresh)return;db.refresh().then(()=>toast("Đã cập nhật")).catch(e=>toast(e.message))}
function csvDown(rows,day){
  const nm=id=>(wards.find(w=>w.id===id)||{name:id||""}).name,q=v=>'"'+String(v).replace(/"/g,'""')+'"',ty={in:"Vào viện",out:"Ra viện",tinh:"Chuyển tỉnh",xfer:"Chuyển khoa"};
  const lines=["Ngày,Giờ,Loại,Khoa,Khoa chuyển đến,Số lượng"].concat(rows.sort((x,y)=>x.ts-y.ts).map(e=>[e.day,hm(e.ts),ty[e.type]||e.type,nm(e.ward),e.to?nm(e.to):"",e.n].map(q).join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="sao-luu-den-"+day+".csv";document.body.appendChild(a);a.click();a.remove()}
async function doArchive(){
  const x=$("ad").value,mx=addDays(today(),-15);
  if(!x)return toast("Chọn ngày chốt");
  if(x>mx)return toast("Ngày chốt phải cách hôm nay ít nhất 15 ngày");
  if(archDay&&x<=archDay)return toast("Ngày chốt phải sau ngày đã chốt trước ("+vnDate(archDay)+")");
  archSel=x;
  if(!ask("archive")){toast("Bấm lần nữa để xác nhận. Hãy chắc chắn không ai đang nhập.");return}
  try{toast("Đang chốt số liệu, vui lòng chờ…");const r=await db.archive(x,rows=>csvDown(rows,x));archSel="";toast("Đã chốt đến "+vnDate(x)+", dọn "+r.n+" dòng cũ. File sao lưu đã được tải về.");render()}catch(e){toast("Lỗi: "+e.message)}}
function renderDay(a){
  const t=today(),d=selDay||t,ev=events.filter(e=>e.day===d);
  if(archDay&&d<=archDay){a.innerHTML=`<div class="card"><b>Số lượng bệnh nhân ra, vào, chuyển khoa theo ngày</b><div class="row" style="margin-top:8px"><input type="date" value="${d}" max="${t}" style="flex:1" onchange="selDay=this.value||'';render()"><button class="sm" onclick="selDay='';render()">Hôm nay</button></div></div><div class="card msg">Số liệu đến hết ngày ${vnDate(archDay)} đã được chốt, không còn chi tiết theo ngày. Hãy chọn ngày sau đó.</div>`;return}
  const sum=(l,ty)=>l.filter(e=>e.type===ty).reduce((s,e)=>s+e.n,0),sumO=l=>sum(l,"out")+sum(l,"tinh");
  const rows=wards.map(w=>{const l=ev.filter(e=>e.ward===w.id);return{name:w.name,i:sum(l,"in"),tr:l.filter(e=>e.type==="in"&&isTruc(e.ts)).reduce((s,e)=>s+e.n,0),o:sumO(l),ct:sum(l,"tinh"),xo:sum(l,"xfer"),xi:ev.filter(e=>e.type==="xfer"&&e.to===w.id).reduce((s,e)=>s+e.n,0),c:censusAt(w,d)}});
  const T=rows.reduce((s,r)=>({i:s.i+r.i,tr:s.tr+r.tr,o:s.o+r.o,ct:s.ct+r.ct,xi:s.xi+r.xi,xo:s.xo+r.xo,c:s.c+r.c}),{i:0,tr:0,o:0,ct:0,xi:0,xo:0,c:0});
  const days=[];for(let k=0;k<14;k++)days.push(addDays(t,-k));
  const hist=days.map(x=>{const l=events.filter(e=>e.day===x);return{day:x,i:sum(l,"in"),o:sumO(l),c:wards.reduce((s,w)=>s+censusAt(w,x),0)}});
  a.innerHTML=`<div class="card"><b>Số lượng bệnh nhân ra, vào, chuyển khoa theo ngày</b>
  <div class="row" style="margin-top:8px"><input type="date" id="dd" value="${d}" max="${t}" style="flex:1" onchange="selDay=this.value||'';render()"><button class="sm" onclick="selDay='';render()">Hôm nay</button></div></div>
  <div class="card wrap"><b>Ngày ${vnDate(d)}</b><table style="margin-top:6px"><thead><tr><th>Khoa</th><th>Vào<br>7h30–17h</th><th>Vào trực<br>17h–7h30</th><th>Ra viện<br>(gồm CT)</th><th>Trong đó<br>chuyển tỉnh</th><th>Chuyển đến</th><th>Chuyển đi</th><th>Đang ĐT cuối ngày</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="in">+${r.i-r.tr}</td><td class="in">+${r.tr}</td><td class="out">−${r.o}</td><td class="out">${r.ct}</td><td class="in">+${r.xi}</td><td class="out">−${r.xo}</td><td>${r.c}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>TỔNG</td><td class="in">+${T.i-T.tr}</td><td class="in">+${T.tr}</td><td class="out">−${T.o}</td><td class="out">${T.ct}</td><td class="in">+${T.xi}</td><td class="out">−${T.xo}</td><td>${T.c}</td></tr></tfoot></table></div>
  <div class="card wrap"><b>14 ngày gần nhất</b><p class="mu">Bấm vào một ngày để xem chi tiết theo khoa.</p><table><thead><tr><th>Ngày</th><th>Vào viện (cả 2 kíp)</th><th>Ra viện (gồm chuyển tỉnh)</th><th>Đang ĐT cuối ngày</th></tr></thead><tbody>
  ${hist.map(h=>`<tr onclick="selDay='${h.day}';render();scrollTo(0,0)" style="cursor:pointer${h.day===d?";font-weight:700":""}"><td>${vnDate(h.day)}</td><td class="in">+${h.i}</td><td class="out">−${h.o}</td><td>${h.c}</td></tr>`).join("")}
  </tbody></table></div>`}
function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
const hp=s=>h53("bv-pin:"+s);
function go(k){if(k!=="set")unlocked=false;tab=k;render()}
function renderLock(a){
  a.innerHTML=pinHash?`<div class="card"><b>🔒 Cài đặt đã khóa</b><p class="mu">Chỉ người quản trị được sửa khoa và giường kế hoạch.</p><label>Mật khẩu</label><input id="pw" type="password" style="width:100%" onkeydown="if(event.key==='Enter')tryPin()"><button class="go pri" onclick="tryPin()">Mở khóa</button></div>`
  :`<div class="card"><b>Tạo mật khẩu quản trị</b><p class="mu">Chưa có mật khẩu. Người đầu tiên tạo sẽ là quản trị, hãy nhớ mật khẩu này.</p><label>Mật khẩu (tối thiểu 4 ký tự)</label><input id="pw" type="password" style="width:100%"><label>Nhập lại</label><input id="pw2" type="password" style="width:100%"><button class="go pri" onclick="makePin()">Tạo mật khẩu</button></div>`}
function tryPin(){if(hp($("pw").value)===pinHash){unlocked=true;render()}else{toast("Sai mật khẩu");$("pw").value=""}}
async function makePin(){const a=$("pw").value,b=$("pw2").value;if(a.length<4)return toast("Mật khẩu tối thiểu 4 ký tự");if(a!==b)return toast("Hai ô không khớp");try{await db.setPin(hp(a));unlocked=true;render()}catch(e){toast("Lỗi lưu: "+e.message)}}
async function changePin(){const a=$("np").value;if(a.length<4)return toast("Mật khẩu tối thiểu 4 ký tự");try{await db.setPin(hp(a));$("np").value="";toast("Đã đổi mật khẩu")}catch(e){toast("Lỗi: "+e.message)}}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",3500)}
window.alert=toast;
function ask(id){if(pend===id){pend="";return true}pend=id;render();setTimeout(()=>{if(pend===id){pend="";render()}},4000);return false}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date(Date.now()-27000000);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const hm=t=>new Date(t).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});

function calc(){
  const m={};
  wards.forEach(w=>m[w.id]={...w,inT:0,inTr:0,outT:0,inA:0,outA:0,xIn:0,xOut:0,ctT:0});
  events.forEach(e=>{
    const t=e.day===today();
    if(e.type==="xfer"){const f=m[e.ward],g=m[e.to];if(f)f.xOut+=e.n;if(g)g.xIn+=e.n;return}
    const r=m[e.ward];if(!r)return;
    if(e.type==="in"){r.inA+=e.n;if(t){r.inT+=e.n;if(isTruc(e.ts))r.inTr+=e.n}}else{r.outA+=e.n;if(t){r.outT+=e.n;if(e.type==="tinh")r.ctT+=e.n}}});
  return Object.values(m).map(r=>({...r,cur:Math.max(0,(r.base||0)+r.inA-r.outA+r.xIn-r.xOut)}));
}
function allowed(){return me?["sum","pk","khoa","ct","xf","day","set"]:["sum","day","set"]}
function nav(){
  if(tab!=="acc"&&tab!=="login"&&!allowed().includes(tab))tab=allowed()[0];
  $("nav").innerHTML=TABS.filter(([k])=>allowed().includes(k)).map(([k,t])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${t}</button>`).join("");
}
function stepper(k){
  return `<div class="step"><button onclick="chg('${k}',-1)">−</button><input id="q_${k}" type="number" inputmode="numeric" min="1" value="${qty[k]}" oninput="qty['${k}']=Math.max(1,parseInt(this.value)||1)"><button onclick="chg('${k}',1)">+</button></div>`;
}
function chg(k,d){qty[k]=Math.max(1,(parseInt($("q_"+k).value)||1)+d);$("q_"+k).value=qty[k]}
function opts(sel,ex){return wards.filter(w=>w.id!==ex).map(w=>`<option value="${w.id}" ${w.id===sel?"selected":""}>${esc(w.name)}</option>`).join("")}
function wardCard(r){
  const pct=r.beds?Math.round(r.cur/r.beds*100):0;
  return `<div class="stats"><div class="stat"><b>${r.cur}/${r.beds||0}</b><span>Đang điều trị / giường KH</span></div>
  <div class="stat"><b class="${r.beds-r.cur<0?"bad":"ok"}">${(r.beds||0)-r.cur}</b><span>Giường trống</span></div>
  <div class="stat"><b>${pct}%</b><span>Công suất</span></div></div>
  <div class="bar ${pct>100?"full":""}"><i style="width:${Math.min(100,pct)}%"></i></div>
  <p class="mu">Hôm nay: <span class="in">+${r.inT} vào</span> · <span class="out">−${r.outT} ra</span>${r.ctT?` (trong đó ${r.ctT} chuyển tỉnh)`:""}</p>`;
}
function loadMe(){try{return JSON.parse(localStorage.getItem("me")||"null")}catch(e){return null}}
function saveMe(){try{if(me)localStorage.setItem("me",JSON.stringify(me));else localStorage.removeItem("me")}catch(e){}}
const myWard=()=>me&&me.t==="ward"?wards.find(w=>w.id===me.id):null;
const isDefPw=()=>me.t==="pk"?(!pkHash||pkHash===hp("123")):(()=>{const w=myWard();return !w||!w.pw||w.pw===hp("123")})();
function logout(){me=null;saveMe();tab="sum";render()}
function whoBar(){
  if(!me){$("who").innerHTML=tab==="login"?"":`<button class="sm" style="background:var(--pri);color:#fff;border-color:var(--pri)" onclick="tab='login';render()">Đăng nhập khoa</button>`;return}
  const nm=(myWard()||{name:"?"}).name;

  async function writeMeta(fields,paths){
    const v=Date.now()+"-"+Math.random().toString(36).slice(2,6);fields.ver={stringValue:v};
    await api("PATCH",metaUrl([...paths,"ver"]),{fields});ver=v}
  function emit(){
    const all=Object.entries(EV).map(([id,d])=>({id,...d,mts:d.ts,ts:d.at||d.ts,day:sd(d.at||d.ts)}));
    const voided=new Set(all.filter(e=>e.type==="void").map(e=>e.ref));
    const ev=all.filter(e=>e.type!=="void"&&!voided.has(e.id)&&(!ARCH||e.day>ARCH));
    const ws=Object.entries(W).map(([id,d])=>({id,...d})).sort((a,b)=>(a.ts||0)-(b.ts||0));
    onData(ws,ev,PIN,ARCH,PK)}
  async function pull(full){
    let m;try{m=await api("GET",metaUrl())}catch(e){if(e.status===404)m={fields:{}};else throw e}
    const f=m.fields||{},v=f.ver?f.ver.stringValue:"";PIN=f.pin?f.pin.stringValue:"";ARCH=f.archivedTo?f.archivedTo.stringValue:"";PK=f.pkpw?f.pkpw.stringValue:"";
    if(!full&&ready&&v===ver)return;
    const wf=(f.wards&&f.wards.mapValue&&f.wards.mapValue.fields)||{},w={};
    for(const id in wf)w[id]=dec(wf[id].mapValue.fields||{});
    const q={structuredQuery:{from:[{collectionId:"events"}],orderBy:[{field:{fieldPath:"ts"}}]}};
    if(!full&&ready&&lastTs)q.structuredQuery.where={fieldFilter:{field:{fieldPath:"ts"},op:"GREATER_THAN",value:{integerValue:String(lastTs-600000)}}};
    const rows=await api("POST",`${base}:runQuery?${K}`,q);
    W=w;
    rows.forEach(r=>{if(!r.document)return;const id=r.document.name.split("/").pop(),d=dec(r.document.fields||{});EV[id]=d;if(d.ts>lastTs)lastTs=d.ts});
    ver=v;ready=true;emit()}
  return{
    onData:f=>onData=f,
    refresh:()=>pull(false),
    async archive(X,onRows){
      await pull(true);
      const all=Object.entries(EV),voided=new Set(all.filter(([,e])=>e.type==="void").map(([,e])=>e.ref));
      const old=all.filter(([,e])=>sd(e.at||e.ts)<=X);
      const eff=old.filter(([id,e])=>e.type!=="void"&&!voided.has(id)&&(!ARCH||sd(e.at||e.ts)>ARCH));
      const c={};Object.keys(W).forEach(id=>c[id]=W[id].base||0);
      eff.forEach(([,e])=>{if(e.type==="xfer"){if(e.ward in c)c[e.ward]-=e.n;if(e.to in c)c[e.to]+=e.n}else if(e.ward in c)c[e.ward]+=e.type==="in"?e.n:-e.n});
      if(onRows)onRows(eff.map(([,e])=>({...e,ts:e.at||e.ts,day:sd(e.at||e.ts)})));
      const wf={},paths=["archivedTo"];
      Object.keys(c).forEach(id=>{wf[id]={mapValue:{fields:{base:{integerValue:String(Math.max(0,c[id]))}}}};paths.push("wards."+id+".base")});
      const fields={archivedTo:{stringValue:X}};if(paths.length>1)fields.wards={mapValue:{fields:wf}};
      await writeMeta(fields,paths);
      Object.keys(c).forEach(id=>{W[id].base=Math.max(0,c[id])});ARCH=X;
      for(let i=0;i<old.length;i+=400){
        const ch=old.slice(i,i+400);
        await api("POST",`${base}:commit?${K}`,{writes:ch.map(([id])=>({delete:`projects/${PID}/databases/(default)/documents/events/${id}`}))});
        ch.forEach(([id])=>delete EV[id])}
      emit();return{n:old.length}},
    async setPk(h){await writeMeta({pkpw:{stringValue:h}},["pkpw"]);PK=h;emit()},
    async setPin(h){await writeMeta({pin:{stringValue:h}},["pin"]);PIN=h;emit()},
    async start(){await pull();setInterval(()=>{if(!document.hidden)pull().catch(()=>{})},45000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull().catch(()=>{})})},
    doc(p){const[c,id]=p.split("/");return{
      async set(d){
        if(c==="wards"){await writeMeta({wards:{mapValue:{fields:{[id]:{mapValue:{fields:encO(d)}}}}}},["wards."+id]);W[id]=d}
        else{await api("PATCH",`${base}/events/${id}?${K}`,{fields:encO(d)});await writeMeta({},[]);EV[id]=d;if(d.ts>lastTs)lastTs=d.ts}
        emit()},
      async update(d){const f=encO(d);await writeMeta({wards:{mapValue:{fields:{[id]:{mapValue:{fields:f}}}}}},Object.keys(d).map(k=>"wards."+id+"."+k));W[id]={...(W[id]||{}),...d};emit()},
      async delete(){if(c==="wards"){await writeMeta({},["wards."+id]);delete W[id];emit()}}
    }}
  }
}
function getCfg(){if(CFG.p&&CFG.k)return CFG;try{const c=JSON.parse(localStorage.getItem("cfg")||"null");if(c&&c.p&&c.k)return c}catch(e){}return null}
function showSetup(err){
  $("nav").innerHTML="";
  $("app").innerHTML=`<div class="card"><b>Kết nối cơ sở dữ liệu đám mây (Firebase)</b>
  ${err?`<p class="bad">${esc(err)}</p>`:""}<p class="mu">Làm theo file HUONG-DAN.txt rồi dán 2 thông tin sau:</p>
  <label>Project ID</label><input id="cp" style="width:100%" placeholder="vd: benhvien-abc12">
  <label>API Key</label><input id="ck" style="width:100%" placeholder="AIza...">
  <button class="go pri" onclick="saveCfg()">Lưu và kết nối</button></div>`}
function saveCfg(){const p=$("cp").value.trim(),k=$("ck").value.trim();if(!p||!k)return alert("Nhập đủ 2 ô");localStorage.setItem("cfg",JSON.stringify({p,k}));location.reload()}
(async()=>{
  const cfg=getCfg();if(!cfg){ready=true;showSetup();return}
  try{
    const d=makeCloudDb(cfg.p,cfg.k);
    db={doc:p=>d.doc(p),setPin:h=>d.setPin(h),setPk:h=>d.setPk(h),refresh:()=>d.refresh(),archive:(x,f)=>d.archive(x,f)};
    d.onData((w,e,p,ar,pk)=>{wards=w;events=e;pinHash=p||"";archDay=ar||"";pkHash=pk||"";ready=true;if(!/INPUT|SELECT/.test((document.activeElement||{}).tagName||""))render()});
    await d.start();
  }catch(e){ready=true;showSetup(e.message)}
})();
</script>
